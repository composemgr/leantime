# nginx proxy address - http://172.17.0.1:8077

name: leantime
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  leantime:
    image: leantime/leantime:latest
    pull_policy: always
    container_name: leantime-app
    restart: always
    logging: *default-logging
    networks:
      - leantime
    ports:
      - "172.17.0.1:8077:80"
    environment:
      TZ: ${TZ:-America/New_York}
      LEAN_DB_HOST: leantime-db
      LEAN_DB_PORT: 3306
      LEAN_DB_DATABASE: ${DB_CREATE_DATABASE_NAME:-leantime}
      LEAN_DB_USER: ${DB_USER_NAME:-leantime}
      LEAN_DB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      LEAN_APP_URL: https://${BASE_HOST_NAME:-$HOSTNAME}
      LEAN_SESSION_PASSWORD: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      LEAN_EMAIL_RETURN: ${EMAIL_SERVER_MAIL_FROM:-no-reply@example.com}
      LEAN_EMAIL_USE_SMTP: 1
      LEAN_EMAIL_SMTP_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      LEAN_EMAIL_SMTP_PORT: ${EMAIL_SERVER_PORT:-587}
      LEAN_EMAIL_SMTP_USERNAME: ${EMAIL_SERVER_USER:-}
      LEAN_EMAIL_SMTP_PASSWORD: ${EMAIL_SERVER_PASS:-}
    volumes:
      - ./volumes/data/leantime:/var/www/html/userfiles
      - ./volumes/config/leantime:/var/www/html/public/userfiles
    depends_on:
      leantime-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  leantime-db:
    image: mariadb:latest
    pull_policy: always
    container_name: leantime-db
    restart: always
    logging: *default-logging
    networks:
      - leantime
    environment:
      TZ: ${TZ:-America/New_York}
      MARIADB_DATABASE: ${DB_CREATE_DATABASE_NAME:-leantime}
      MARIADB_USER: ${DB_USER_NAME:-leantime}
      MARIADB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
    volumes:
      - ./volumes/data/db/mariadb/leantime:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  leantime:
    name: leantime
    external: false
